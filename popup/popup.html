<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="header-left">
      <span class="title">aiom</span>
      <span id="model-label" class="model-label"></span>
    </div>
    <div class="header-actions">
      <button id="btn-clear" title="Clear chat">Clear</button>
      <button id="btn-settings" title="Settings">⚙</button>
    </div>
  </header>

  <div id="banner" class="banner hidden">
    No API key configured. <a href="#" id="banner-link">Open Settings</a>
  </div>

  <main id="chat-messages"></main>

  <footer>
    <textarea id="input" rows="1" placeholder="Type a message..."></textarea>
    <button id="btn-send">Send</button>
    <button id="btn-stop" class="hidden" title="Stop generating">Stop</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
